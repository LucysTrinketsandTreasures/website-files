---
layout: default
---
<section class="product-detail">
  <div class="product-detail-photo" style="--frame: var(--{{ page.color }});">
    <img src="{{ '/assets/images/' | append: page.image | relative_url }}" alt="{{ page.name }}">
  </div>
  <div>
    <h1>{{ page.name }}</h1>
    {% if page.price %}<p class="product-price">{{ page.price }}</p>{% endif %}
    <div class="product-description">{{ content }}</div>
    <div class="product-buttons">
      {% if page.buy_link %}
      <a class="btn btn-buy" href="{{ page.buy_link }}">Buy</a>
      {% else %}
      <button class="btn btn-buy" type="button" onclick="document.getElementById('buy-note').hidden = false;">Buy</button>
      {% endif %}
      <a class="btn btn-home" href="{{ '/' | relative_url }}">&larr; Back to Home</a>
    </div>
    <p class="buy-note" id="buy-note" hidden>Online buying is coming soon. Check back shortly!</p>
  </div>
</section>
